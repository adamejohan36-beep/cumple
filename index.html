<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>


<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #0f0f1a;

    color: white;

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* =========================
   PANTALLA PRINCIPAL
========================= */

.inicio {

    text-align: center;

    animation: aparecer 1s ease;
}

.inicio h1 {

    font-size: 55px;

    margin: 0 0 20px;

    text-shadow:
        0 0 15px #ff1744,
        0 0 35px #ff1744;
}

.inicio p {

    color: #ccc;

    font-size: 18px;

    margin-bottom: 35px;
}


.botones-inicio {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 15px;
}


.boton-start,
.boton-options {

    width: 220px;

    padding: 16px;

    border-radius: 35px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}


/* START */

.boton-start {

    border: none;

    background: #ff1744;

    color: white;

    box-shadow:
        0 0 25px #ff1744;
}


.boton-start:hover {

    transform: scale(1.08);

    box-shadow:
        0 0 45px #ff1744;
}


/* OPTIONS */

.boton-options {

    border: 1px solid #ff1744;

    background: transparent;

    color: white;
}


.boton-options:hover {

    background: rgba(255, 23, 68, 0.15);

    transform: scale(1.08);

    box-shadow:
        0 0 20px #ff1744;
}


/* =========================
   CIELO ESTRELLADO
========================= */

.cielo {

    display: none;

    position: fixed;

    inset: 0;

    background:

        radial-gradient(
            circle at 50% 20%,
            #202050 0%,
            #0b0b24 45%,
            #03030d 100%
        );

    overflow: hidden;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    animation: aparecerCielo 2s ease;
}


/* =========================
   ESTRELLAS
========================= */

.estrella {

    position: absolute;

    width: 3px;

    height: 3px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 8px white;

    animation:
        parpadear 2s infinite alternate;
}


.estrella:nth-child(1) {
    top: 10%;
    left: 15%;
    animation-delay: 0.2s;
}

.estrella:nth-child(2) {
    top: 20%;
    left: 35%;
    animation-delay: 0.8s;
}

.estrella:nth-child(3) {
    top: 15%;
    left: 70%;
    animation-delay: 1.2s;
}

.estrella:nth-child(4) {
    top: 30%;
    left: 85%;
    animation-delay: 0.5s;
}

.estrella:nth-child(5) {
    top: 45%;
    left: 10%;
    animation-delay: 1.5s;
}

.estrella:nth-child(6) {
    top: 55%;
    left: 25%;
    animation-delay: 0.7s;
}

.estrella:nth-child(7) {
    top: 65%;
    left: 80%;
    animation-delay: 1.8s;
}

.estrella:nth-child(8) {
    top: 75%;
    left: 60%;
    animation-delay: 0.4s;
}

.estrella:nth-child(9) {
    top: 85%;
    left: 20%;
    animation-delay: 1s;
}

.estrella:nth-child(10) {
    top: 40%;
    left: 55%;
    animation-delay: 1.3s;
}

.estrella:nth-child(11) {
    top: 12%;
    left: 90%;
    animation-delay: 0.9s;
}

.estrella:nth-child(12) {
    top: 70%;
    left: 40%;
    animation-delay: 1.7s;
}

.estrella:nth-child(13) {
    top: 35%;
    left: 40%;
    animation-delay: 0.3s;
}

.estrella:nth-child(14) {
    top: 80%;
    left: 90%;
    animation-delay: 1.1s;
}

.estrella:nth-child(15) {
    top: 25%;
    left: 5%;
    animation-delay: 1.6s;
}


/* =========================
   LUNA
========================= */

.luna {

    width: 170px;

    height: 170px;

    border-radius: 50%;

    background: #fffde7;

    box-shadow:

        0 0 20px #fffde7,

        0 0 50px #fffde7,

        0 0 100px rgba(255,255,220,0.5);

    position: relative;

    z-index: 2;

    animation:
        lunaAparecer 2s ease,
        flotar 5s ease-in-out infinite;
}


/* CRÁTERES */

.luna::before {

    content: "";

    position: absolute;

    width: 35px;

    height: 35px;

    border-radius: 50%;

    background: rgba(180,180,160,0.25);

    top: 35px;

    left: 45px;

    box-shadow:

        45px 25px 0 8px rgba(180,180,160,0.18),

        15px 75px 0 5px rgba(180,180,160,0.2),

        70px 90px 0 10px rgba(180,180,160,0.15);
}


/* =========================
   TEXTO DEL CIELO
========================= */

.mensaje-cielo {

    text-align: center;

    margin-top: 45px;

    z-index: 3;

    animation: aparecer 2s ease;
}


.mensaje-cielo h2 {

    font-size: 38px;

    margin-bottom: 12px;

    text-shadow:

        0 0 10px #ff1744,

        0 0 25px #ff1744;
}


.mensaje-cielo p {

    color: #ddd;

    font-size: 18px;

    margin-bottom: 30px;
}


/* =========================
   BOTÓN TU HISTORIA
========================= */

.boton-historia {

    padding: 17px 45px;

    border-radius: 35px;

    border: 1px solid #ff1744;

    background: rgba(255, 23, 68, 0.1);

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;

    box-shadow:
        0 0 15px rgba(255, 23, 68, 0.3);
}


.boton-historia:hover {

    transform: scale(1.08);

    background: rgba(255, 23, 68, 0.25);

    box-shadow:
        0 0 30px #ff1744;
}


/* TEXTO MADE BY JOHAN */

.boton-historia span {

    display: block;

    margin-top: 8px;

    font-size: 14px;

    font-weight: normal;

    color: #ff9aae;
}


/* =========================
   OPCIONES
========================= */

.opciones-pantalla {

    display: none;

    width: 90%;

    max-width: 600px;

    text-align: center;

    animation: aparecer 0.8s ease;
}


.opciones-pantalla h2 {

    font-size: 42px;

    margin-bottom: 10px;

    text-shadow:

        0 0 15px #ff1744,

        0 0 30px #ff1744;
}


.opciones-pantalla p {

    color: #ccc;

    margin-bottom: 30px;
}


.niveles {

    display: flex;

    flex-direction: column;

    gap: 15px;
}


.nivel {

    padding: 20px;

    border-radius: 20px;

    border: 1px solid #ff1744;

    background: rgba(255, 23, 68, 0.08);

    color: white;

    font-size: 19px;

    cursor: pointer;

    transition: 0.3s;
}


.nivel:hover {

    transform: scale(1.05);

    background: rgba(255, 23, 68, 0.2);

    box-shadow:
        0 0 25px #ff1744;
}


.boton-home {

    margin-top: 30px;

    padding: 13px 30px;

    border-radius: 30px;

    border: 1px solid #777;

    background: transparent;

    color: #ccc;

    font-size: 16px;

    cursor: pointer;

    transition: 0.3s;
}


.boton-home:hover {

    color: white;

    border-color: #ff1744;

    transform: scale(1.05);
}


/* =========================
   VENTANA DIFICULTAD
========================= */

.mensaje-nivel {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.8);

    justify-content: center;

    align-items: center;

    z-index: 10;
}


.mensaje-contenido {

    width: 90%;

    max-width: 450px;

    padding: 40px 25px;

    text-align: center;

    background: #191925;

    border-radius: 25px;

    border: 1px solid #ff1744;

    box-shadow:
        0 0 40px rgba(255,23,68,0.5);

    animation: aparecer 0.4s ease;
}


.mensaje-contenido h2 {

    color: #ff5275;

    font-size: 28px;
}


.mensaje-contenido p {

    color: #ddd;

    font-size: 17px;

    line-height: 1.6;
}


.mensaje-contenido button {

    margin-top: 20px;

    padding: 12px 35px;

    border: none;

    border-radius: 30px;

    background: #ff1744;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}


.mensaje-contenido button:hover {

    transform: scale(1.08);

    box-shadow:
        0 0 20px #ff1744;
}


/* =========================
   FONDO DE LA CARTA
========================= */

.carta-fondo {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.82);

    justify-content: center;

    align-items: center;

    z-index: 20;

    padding: 20px;

}


/* =========================
   SOBRE
========================= */

.carta-animada {

    position: relative;

    width: 360px;

    height: 250px;

    perspective: 1200px;

    animation: aparecerCarta 0.8s ease;

}


/* SOBRE */

.sobre {

    position: absolute;

    width: 100%;

    height: 100%;

    background: #fff0f3;

    border-radius: 8px;

    box-shadow:

        0 0 30px rgba(255,255,255,0.25),

        0 0 60px rgba(255,23,68,0.35);

    overflow: hidden;

    z-index: 3;
}


/* PARTE INFERIOR */

.sobre::before {

    content: "";

    position: absolute;

    left: 0;

    bottom: 0;

    width: 0;

    height: 0;

    border-left: 180px solid transparent;

    border-right: 180px solid transparent;

    border-bottom: 130px solid #ffd6df;

    z-index: 4;
}


/* LADO */

.sobre::after {

    content: "";

    position: absolute;

    left: 0;

    top: 0;

    width: 0;

    height: 0;

    border-top: 125px solid transparent;

    border-bottom: 125px solid transparent;

    border-left: 180px solid #ffc3d0;

    z-index: 3;
}


/* =========================
   PAPEL
========================= */

.papel {

    position: absolute;

    left: 7%;

    bottom: 0;

    width: 86%;

    height: 88%;

    background: #fffaf5;

    border-radius: 6px;

    box-shadow:
        0 0 15px rgba(0,0,0,0.15);

    z-index: 1;

    padding: 25px;

    text-align: center;

    overflow: hidden;

    /*
       COMIENZA COMPLETAMENTE
       DENTRO DEL SOBRE
    */

    transform: translateY(0);

    opacity: 0;

    transition:
        transform 1.4s ease,
        opacity 0.5s ease;

}


/*
   CUANDO EL SOBRE YA ESTÁ ABIERTO
   EL PAPEL SUBE
*/

.carta-animada.abierta .papel {

    transform: translateY(-72%);

    opacity: 1;

}


/* =========================
   TAPA DEL SOBRE
========================= */

.tapa {

    position: absolute;

    top: 0;

    left: 0;

    width: 0;

    height: 0;

    border-left: 180px solid transparent;

    border-right: 180px solid transparent;

    border-top: 125px solid #ffb6c6;

    transform-origin: top center;

    transition: transform 1.2s ease;

    z-index: 6;
}


/* ABRIR TAPA */

.carta-animada.abierta .tapa {

    transform: rotateX(180deg);

    z-index: 0;

}


/* =========================
   CORAZÓN
========================= */

.corazon-sobre {

    position: absolute;

    top: 95px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 42px;

    z-index: 7;

    transition: 0.5s;

}


.carta-animada.abierta .corazon-sobre {

    opacity: 0;

    transform:
        translateX(-50%)
        scale(0);

}


/* =========================
   CONTENIDO
========================= */

.contenido-carta {

    opacity: 0;

    transform: translateY(15px);

    transition:
        opacity 1s ease 1.7s,
        transform 1s ease 1.7s;

}


.carta-animada.abierta .contenido-carta {

    opacity: 1;

    transform: translateY(0);

}


.contenido-carta h2 {

    color: #ff1744;

    font-size: 27px;

    margin-top: 0;

    margin-bottom: 18px;

}


.texto-carta {

    min-height: 110px;

    color: #444;

    font-size: 16px;

    line-height: 1.7;

    text-align: left;

}


/* =========================
   BOTÓN CERRAR
========================= */

.boton-cerrar-carta {

    opacity: 0;

    pointer-events: none;

    margin-top: 15px;

    padding: 10px 25px;

    border: none;

    border-radius: 25px;

    background: #ff1744;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition:
        opacity 0.8s ease 1.8s,
        transform 0.3s;
}


.carta-animada.abierta .boton-cerrar-carta {

    opacity: 1;

    pointer-events: auto;
}


.boton-cerrar-carta:hover {

    transform: scale(1.08);

    box-shadow:
        0 0 20px #ff1744;
}


/* =========================
   ANIMACIONES
========================= */

@keyframes aparecer {

    from {

        opacity: 0;

        transform: translateY(25px);
    }

    to {

        opacity: 1;

        transform: translateY(0);
    }
}


@keyframes aparecerCielo {

    from {

        opacity: 0;
    }

    to {

        opacity: 1;
    }
}


@keyframes lunaAparecer {

    from {

        opacity: 0;

        transform: scale(0);
    }

    to {

        opacity: 1;

        transform: scale(1);
    }
}


@keyframes flotar {

    0% {

        transform: translateY(0);
    }

    50% {

        transform: translateY(-12px);
    }

    100% {

        transform: translateY(0);
    }
}


@keyframes parpadear {

    from {

        opacity: 0.2;

        transform: scale(0.7);
    }

    to {

        opacity: 1;

        transform: scale(1.4);
    }
}


@keyframes aparecerCarta {

    from {

        opacity: 0;

        transform: scale(0.6);
    }

    to {

        opacity: 1;

        transform: scale(1);
    }
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .inicio h1 {

        font-size: 40px;
    }

    .inicio p {

        font-size: 16px;
    }

    .luna {

        width: 130px;

        height: 130px;
    }

    .mensaje-cielo h2 {

        font-size: 30px;
    }

    .mensaje-cielo p {

        font-size: 16px;
    }

    .boton-historia {

        padding: 15px 30px;

        font-size: 17px;
    }

    .carta-animada {

        width: 320px;

        height: 220px;

    }

    .tapa {

        border-left-width: 160px;

        border-right-width: 160px;

        border-top-width: 110px;

    }

    .sobre::before {

        border-left-width: 160px;

        border-right-width: 160px;

        border-bottom-width: 115px;

    }

    .sobre::after {

        border-top-width: 110px;

        border-bottom-width: 110px;

        border-left-width: 160px;

    }

    .corazon-sobre {

        top: 82px;

        font-size: 36px;

    }

    .papel {

        padding: 20px;

    }

}

</style>

</head>


<body>


<!-- =========================
     PANTALLA PRINCIPAL
========================= -->

<div class="inicio" id="inicio">

    <h1>
        Happy Birthday ❤️
    </h1>

    <p>
        I made something special for you...
    </p>


    <div class="botones-inicio">

        <button
            class="boton-start"
            onclick="start()">

            START

        </button>


        <button
            class="boton-options"
            onclick="abrirOpciones()">

            OPTIONS

        </button>

    </div>

</div>



<!-- =========================
     CIELO ESTRELLADO
========================= -->

<div class="cielo" id="cielo">


    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>
    <div class="estrella"></div>


    <div class="luna"></div>


    <div class="mensaje-cielo">

        <h2>
            For you, my love ❤️
        </h2>

        <p>
            There is a little story waiting for you...
        </p>


        <button
            class="boton-historia"
            onclick="abrirHistoria()">

            📖 Tu historia ❤️

            <span>
                Made by Johan ❤️
            </span>

        </button>

    </div>

</div>



<!-- =========================
     OPCIONES
========================= -->

<div
    class="opciones-pantalla"
    id="opcionesPantalla">


    <h2>
        Love Options ❤️
    </h2>


    <p>
        Choose your level of love...
    </p>


    <div class="niveles">


        <button
            class="nivel"
            onclick="seleccionarNivel('Soft Love')">

            💗 Soft Love

        </button>


        <button
            class="nivel"
            onclick="seleccionarNivel('High Love')">

            ❤️ High Love

        </button>


        <button
            class="nivel"
            onclick="seleccionarNivel('Love Difficulty: Johan')">

            💖 Love Difficulty: Johan

        </button>


    </div>


    <button
        class="boton-home"
        onclick="volverInicio()">

        🏠 Back to Home

    </button>

</div>



<!-- =========================
     MENSAJE DE DIFICULTAD
========================= -->

<div
    class="mensaje-nivel"
    id="mensajeNivel">


    <div class="mensaje-contenido">


        <h2 id="tituloNivel"></h2>


        <p id="textoNivel"></p>


        <button
            onclick="cerrarNivel()">

            BACK

        </button>


    </div>

</div>



<!-- =========================
     CARTA
========================= -->

<div
    class="carta-fondo"
    id="carta">


    <div
        class="carta-animada"
        id="cartaAnimada">


        <!-- SOBRE -->

        <div class="sobre"></div>


        <!-- PAPEL -->

        <div class="papel">


            <div class="contenido-carta">


                <h2>
                    💌 Tu Historia ❤️
                </h2>


                <!--
                    AQUÍ PONDREMOS
                    EL TEXTO QUE ME VAS A DAR
                -->

                <div class="texto-carta">

                </div>


                <button
                    class="boton-cerrar-carta"
                    onclick="cerrarCarta()">

                    Close ❤️

                </button>


            </div>

        </div>


        <!-- TAPA -->

        <div class="tapa"></div>


        <!-- CORAZÓN -->

        <div class="corazon-sobre">

            ❤️

        </div>


    </div>

</div>



<script>


/* =========================
   START
========================= */

function start() {

    document.getElementById("inicio")
        .style.display = "none";


    document.getElementById("cielo")
        .style.display = "flex";

}



/* =========================
   ABRIR HISTORIA
========================= */

function abrirHistoria() {

    const fondo =
        document.getElementById("carta");

    const cartaAnimada =
        document.getElementById("cartaAnimada");


    fondo.style.display = "flex";


    cartaAnimada.classList.remove("abierta");


    /*
       ESPERAMOS A QUE
       APAREZCA EL SOBRE
    */

    setTimeout(function() {

        cartaAnimada.classList.add("abierta");

    }, 700);

}



/* =========================
   CERRAR CARTA
========================= */

function cerrarCarta() {

    const fondo =
        document.getElementById("carta");

    const cartaAnimada =
        document.getElementById("cartaAnimada");


    cartaAnimada.classList.remove("abierta");


    setTimeout(function() {

        fondo.style.display = "none";

    }, 1000);

}



/* =========================
   ABRIR OPCIONES
========================= */

function abrirOpciones() {

    document.getElementById("inicio")
        .style.display = "none";


    document.getElementById("opcionesPantalla")
        .style.display = "block";

}



/* =========================
   VOLVER AL INICIO
========================= */

function volverInicio() {

    document.getElementById("opcionesPantalla")
        .style.display = "none";


    document.getElementById("inicio")
        .style.display = "block";

}



/* =========================
   CAMBIAR DIFICULTAD
========================= */

function seleccionarNivel(nivel) {

    const ventana =
        document.getElementById("mensajeNivel");


    const titulo =
        document.getElementById("tituloNivel");


    const texto =
        document.getElementById("textoNivel");


    titulo.innerHTML =
        "DIFFICULTY CHANGED! ❤️";


    texto.innerHTML =
        "Love difficulty changed to:<br><br>" +

        "<strong>" +
        nivel +
        "</strong> 💕";


    ventana.style.display =
        "flex";

}



/* =========================
   CERRAR DIFICULTAD
========================= */

function cerrarNivel() {

    document.getElementById("mensajeNivel")
        .style.display = "none";

}


</script>


</body>

</html>
